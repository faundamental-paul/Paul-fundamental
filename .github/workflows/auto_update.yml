name: Auto-Update GeoFX Terminal 24/7
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python updater.py
      - run: |
          git config user.name "GeoFX-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed.json
          git commit -m "Update live FX & geopolitical wire" || exit 0
          git push
